# User settings are stored outside the application resources.
# These values are the defaults applied when no user configuration exists.

# UI
ui.language=en

# Indexing
indexing.method=sbert
indexing.paragraphs-per-chunk=6
indexing.overlap-characters=0
indexing.chunk-character-limit=1024
indexing.regenerate-index-on-load=true

# Retrieval
retrieval.top-k=5
retrieval.minimum-score=0.2

# Models
models.ollama.base-url=http://localhost:11434

# Chat and augmentation
chat.answers-enabled=true
augmentation.output-mode=none
